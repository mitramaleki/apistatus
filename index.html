  <script>
    const proxyUrl = 'https://corsproxy.io/?';
    const timeoutMs = 15000;

    // ✅ FIX: Define which status codes are actually ACTIVE
    // These status codes mean the SERVER EXISTS and is responding
    const ACTIVE_STATUSES = new Set([
      // Success
      200, 201, 202, 203, 204, 205, 206,
      // Redirects (server is live)
      301, 302, 303, 307, 308,
      // Client errors (server EXISTS, just blocking or wrong request)
      400, 401, 402, 403, 405, 406, 407, 408, 409,
      411, 412, 413, 414, 415, 416, 417, 418,
      // Rate limiting (server EXISTS)
      429,
      // Server errors (server EXISTS, having issues)
      500, 501, 502, 503, 504, 505, 506, 507, 508, 509, 510, 511,
      // Cloudflare errors (server EXISTS behind Cloudflare)
      520, 521, 522, 523, 524, 525, 526, 527, 528, 529, 530,
      // Other common issues
      444, 499
    ]);

    // These status codes mean the resource is GONE (truly inactive)
    const INACTIVE_STATUSES = new Set([
      404,  // Not Found
      410,  // Gone
      451   // Unavailable For Legal Reasons
    ]);

    // ✅ NEW: Helper function to normalize URLs
    function normalizeUrl(url) {
      url = url.trim();
      // If URL doesn't have a protocol, add https://
      if (!/^https?:\/\//i.test(url)) {
        return 'https://' + url;
      }
      return url;
    }

    // Helper function to get the base domain from a URL
    function getBaseUrl(url) {
      try {
        const urlObj = new URL(url);
        return urlObj.origin; // Returns scheme + domain (e.g., https://example.com)
      } catch {
        return null;
      }
    }

    // Check a single URL with retry logic
    async function checkUrlWithRetry(url, maxRetries = 3) {
      // ✅ FIX: Normalize the URL before checking
      const normalizedUrl = normalizeUrl(url);
      let lastError;
      
      for (let attempt = 0; attempt < maxRetries; attempt++) {
        try {
          if (attempt > 0) {
            const waitTime = 3000 * Math.pow(2, attempt - 1);
            await new Promise(resolve => setTimeout(resolve, waitTime));
          }
          
          const result = await checkUrl(normalizedUrl);
          return result;
        } catch (error) {
          lastError = error;
          if (error.message.includes('429') || error.message.includes('aborted') || error.message.includes('Failed to fetch')) {
            continue;
          }
          return {
            url: normalizedUrl,
            statusLabel: 'Non-active',
            statusInfo: error.message,
            ok: false,
            why: 'Connection error'
          };
        }
      }
      
      return {
        url: normalizedUrl,
        statusLabel: 'Non-active',
        statusInfo: lastError?.message || 'Failed after retries',
        ok: false,
        why: 'All retries failed'
      };
    }

    // Check a single URL - FIXED with proper status classification AND base domain fallback
    async function checkUrl(url) {
      const proxyFullUrl = proxyUrl + encodeURIComponent(url);

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), timeoutMs);

      try {
        const response = await fetch(proxyFullUrl, {
          signal: controller.signal,
          redirect: 'follow'
        });
        clearTimeout(timeoutId);

        const status = response.status;
        
        // ✅ FIX: Check if status is ACTIVE
        if (ACTIVE_STATUSES.has(status)) {
          let why = 'Server responded';
          if (status >= 400 && status < 500) {
            why = `Server exists but ${status === 403 ? 'blocking bots' : status === 429 ? 'rate limiting' : status === 413 ? 'content too large' : 'client error'}`;
          } else if (status >= 500) {
            why = `Server exists but ${status === 526 ? 'SSL issue' : 'server error'}`;
          } else if (status >= 300 && status < 400) {
            why = 'Redirecting to live site';
          }
          
          return {
            url,
            statusLabel: 'Active',
            statusInfo: 'HTTP ' + status,
            ok: true,
            why: why
          };
        }
        
        // --- NEW: Fallback Logic for 404 ---
        if (status === 404) {
          const baseUrl = getBaseUrl(url);
          if (baseUrl && baseUrl !== url) {
            // Check the base domain
            const baseProxyUrl = proxyUrl + encodeURIComponent(baseUrl);
            const baseController = new AbortController();
            const baseTimeoutId = setTimeout(() => baseController.abort(), timeoutMs);

            try {
              const baseResponse = await fetch(baseProxyUrl, {
                signal: baseController.signal,
                redirect: 'follow'
              });
              clearTimeout(baseTimeoutId);

              // If the base domain is active, report the original URL as "Active"
              if (ACTIVE_STATUSES.has(baseResponse.status)) {
                return {
                  url,
                  statusLabel: 'Active',
                  statusInfo: 'Base domain active (original page 404)',
                  ok: true,
                  why: `Base domain (${baseUrl}) is active`
                };
              } else {
                // Base domain is also not active
                return {
                  url,
                  statusLabel: 'Non-active',
                  statusInfo: 'HTTP 404 (original page + base domain check failed)',
                  ok: false,
                  why: 'Page and base domain both inaccessible'
                };
              }
            } catch (baseError) {
              // Fallback check failed
              return {
                url,
                statusLabel: 'Non-active',
                statusInfo: 'HTTP 404 (base domain check failed)',
                ok: false,
                why: 'Page 404, base domain check error'
              };
            }
          }
        }
        // --- End of Fallback Logic ---

        // Check if status is truly INACTIVE (410, 451)
        if (INACTIVE_STATUSES.has(status)) {
          return {
            url,
            statusLabel: 'Non-active',
            statusInfo: 'HTTP ' + status,
            ok: false,
            why: status === 404 ? 'Page not found' : 'Resource permanently gone'
          };
        }

        // Unknown status - treat as Active if server responded
        return {
          url,
          statusLabel: 'Active',
          statusInfo: 'HTTP ' + status + ' (unknown)',
          ok: true,
          why: 'Server responded (unclassified status)'
        };

      } catch (error) {
        clearTimeout(timeoutId);
        throw error;
      }
    }

    // Check all URLs with delay between requests
    async function checkUrls() {
      const urlsInput = document.getElementById('urlsInput').value.trim();
      if (!urlsInput) return;

      const urls = urlsInput.split('\n').map(s => s.trim()).filter(Boolean);
      const resultsElem = document.getElementById('results');
      const summaryElem = document.getElementById('summary');
      const progressBar = document.getElementById('progressBar');
      const statusMessage = document.getElementById('statusMessage');
      const checkBtn = document.getElementById('checkBtn');
      const exportBtn = document.getElementById('exportBtn');
      const delayInput = document.getElementById('delayInput');

      const delayMs = parseInt(delayInput.value) || 500;

      resultsElem.innerHTML = '';
      summaryElem.textContent = 'Checking URLs...';
      progressBar.style.width = '0%';
      statusMessage.textContent = 'Starting...';
      checkBtn.disabled = true;
      exportBtn.style.display = 'none';
      document.body.classList.add('loading');
      summaryElem.classList.add('pulse');

      const results = [];
      const total = urls.length;
      let activeCount = 0;
      let nonActiveCount = 0;
      let unknownCount = 0;
      
      for (let i = 0; i < total; i++) {
        const url = urls[i];
        
        try {
          const result = await checkUrlWithRetry(url);
          results.push(result);
          
          // Count results
          if (result.statusLabel === 'Active') {
            activeCount++;
          } else if (result.statusLabel === 'Non-active') {
            nonActiveCount++;
          } else {
            unknownCount++;
          }
          
          // Update progress
          const done = results.length;
          const percentage = Math.round((done / total) * 100);
          progressBar.style.width = percentage + '%';
          summaryElem.textContent = `${done}/${total} done | ✅ Active: ${activeCount} | ❌ Non-active: ${nonActiveCount} | ⚠️ Unknown: ${unknownCount}`;
          statusMessage.textContent = `Checking: ${result.url.substring(0, 50)}${result.url.length > 50 ? '...' : ''}`;
          
          // ✅ FIX: Show "Why" column
          const statusClass = result.statusLabel.toLowerCase().replace('/', '-');
          const resultRow = `
            <tr>
              <td>
                <a href="${result.url}" target="_blank">${result.url}</a>
              </td>
              <td class="status-${statusClass}">${result.statusLabel}</td>
              <td>${result.statusInfo}</td>
              <td style="font-size:0.85rem;color:${result.statusLabel === 'Active' ? '#4caf50' : '#f44336'}">${result.why || ''}</td>
            </tr>
          `;
          resultsElem.insertAdjacentHTML('beforeend', resultRow);
          
          if (i < total - 1) {
            await new Promise(resolve => setTimeout(resolve, delayMs));
          }
        } catch (error) {
          results.push({
            url,
            statusLabel: 'Non-active',
            statusInfo: error.message || 'Unknown error',
            ok: false,
            why: 'Unexpected error'
          });
          nonActiveCount++;
        }
      }

      // All done
      summaryElem.textContent = `${total}/${total} done | ✅ Active: ${activeCount} | ❌ Non-active: ${nonActiveCount} | ⚠️ Unknown: ${unknownCount}`;
      progressBar.style.width = '100%';
      statusMessage.textContent = '✅ Complete! All URLs checked.';

      exportBtn.style.display = 'inline-block';
      exportBtn.onclick = () => exportToCsv(results);

      checkBtn.disabled = false;
      document.body.classList.remove('loading');
      summaryElem.classList.remove('pulse');
    }

    // Export results as CSV
    function exportToCsv(results) {
      const headers = ['URL', 'Status', 'Details', 'Why'];
      const csvContent = [
        headers.join(','),
        ...results.map(r => [
          `"${r.url.replace(/"/g, '""')}"`,
          `"${r.statusLabel}"`,
          `"${r.statusInfo ? r.statusInfo.replace(/"/g, '""') : ''}"`,
          `"${r.why ? r.why.replace(/"/g, '""') : ''}"`
        ].join(','))
      ].join('\n');

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      const url = URL.createObjectURL(blob);
      link.setAttribute('href', url);
      link.setAttribute('download', 'url_status_results_fixed.csv');
      link.style.visibility = 'hidden';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // Event listeners
    document.getElementById('checkBtn').addEventListener('click', checkUrls);
    
    document.getElementById('urlsInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        document.getElementById('checkBtn').click();
      }
    });
  </script>
